[project]
name = "english-tutor"
version = "0.1.0"
description = "RAG + LLM репетитор по английскому языку (A1–B1) на локальных моделях"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6",
    "loguru>=0.7",
    "typer>=0.12",
    "httpx>=0.27",
    "numpy>=1.26",
    "chromadb==1.5.9",  # та же версия, что у образа chromadb/chroma в docker-compose.yml
    "rank-bm25>=0.2.2",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "langchain-core>=0.3",
    "langchain-text-splitters>=0.3",
    "langchain-ollama>=0.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "streamlit>=1.40",
]

[project.scripts]
tutor = "tutor.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tutor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
